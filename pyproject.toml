[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wavevector-surface-response"
version = "0.1.0"
description = "Monte Carlo and mode analysis for wavevector-resolved interfacial free-energy response"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

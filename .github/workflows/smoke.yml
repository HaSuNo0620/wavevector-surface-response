name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Unit smoke tests
        run: pytest -q
      - name: End-to-end MC smoke run
        run: |
          python scripts/run_mc.py --config config/smoke.yaml --output results/raw/smoke_mc.npz
          python scripts/analyze_modes.py results/raw/smoke_mc.npz --output-dir results/processed/smoke_modes --n-modes 6
      - name: Validate outputs
        run: |
          python - <<'PY'
          import csv, pathlib, numpy as np
          raw = np.load('results/raw/smoke_mc.npz')
          assert raw['rho_q_tqz'].ndim == 3
          assert raw['rho_q_tqz'].shape[0] >= 2
          rows = list(csv.DictReader(open('results/processed/smoke_modes/mode_summary.csv')))
          assert len(rows) == len(raw['qx'])
          for r in rows:
              assert abs(float(r['closure_error'])) < 1e-8
          print('smoke pipeline OK')
          PY

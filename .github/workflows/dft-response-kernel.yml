name: dft-response-kernel

on:
  push:
    paths:
      - "scripts/run_mc.py"
      - "scripts/analyze_dft_response_kernel.py"
      - "config/ti_slab.yaml"
      - "config/ti_bulk_liquid.yaml"
      - "config/ti_bulk_vapor.yaml"
      - "src/wvsr/**"
      - "pyproject.toml"
      - ".github/workflows/dft-response-kernel.yml"
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        phase: [slab, liquid, vapor]
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Build dense-q config and seed
        id: cfg
        shell: bash
        run: |
          case "${{ matrix.phase }}" in
            slab)   SRC=config/ti_slab.yaml; POFF=100000 ;;
            liquid) SRC=config/ti_bulk_liquid.yaml; POFF=200000 ;;
            vapor)  SRC=config/ti_bulk_vapor.yaml; POFF=300000 ;;
          esac
          DST="config/dft_${{ matrix.phase }}_rep${{ matrix.replica }}.yaml"
          python - "$SRC" "$DST" <<'PY'
          import sys, yaml
          src, dst = sys.argv[1:]
          with open(src, 'r', encoding='utf-8') as f:
              cfg = yaml.safe_load(f)
          cfg['wavevectors']['n_x'] = list(range(1, 21))
          cfg.setdefault('notes', {})['stage'] = 'dense-q A=0 baseline for DFT response kernel'
          with open(dst, 'w', encoding='utf-8') as f:
              yaml.safe_dump(cfg, f, sort_keys=False)
          PY
          SEED=$((20260910 + POFF + 1000*${{ matrix.replica }}))
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
      - name: Run dense-q A=0 baseline
        run: |
          python scripts/run_mc.py \
            --config "${{ steps.cfg.outputs.path }}" \
            --output "results/raw/dft_${{ matrix.phase }}_rep${{ matrix.replica }}.npz" \
            --seed "${{ steps.cfg.outputs.seed }}"
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: dft-baseline-${{ matrix.phase }}-rep${{ matrix.replica }}
          path: results/raw/dft_${{ matrix.phase }}_rep${{ matrix.replica }}.npz
          retention-days: 30

  analyze:
    needs: [baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download dense-q baselines
        uses: actions/download-artifact@v4
        with:
          pattern: dft-baseline-*
          path: results/dft_inputs
          merge-multiple: true
      - name: Analyze local null vs frozen-c2 RY
        run: |
          python scripts/analyze_dft_response_kernel.py \
            results/dft_inputs \
            --output-dir results/processed/dft_response
      - name: Validate outputs
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'results/processed/dft_response/dft_response_prediction.csv'
          df = pd.read_csv(p)
          assert len(df) == 20, len(df)
          assert df[['qx','S_liquid','chi_ry','chi_fdt']].notna().all().all()
          print(df[['nx','qx','S_liquid','chi_ry','chi_fdt','se_chi_fdt']].to_string(index=False))
          PY
      - name: Upload DFT response results
        uses: actions/upload-artifact@v4
        with:
          name: dft-response-kernel-results
          path: results/processed/dft_response/**
          retention-days: 30

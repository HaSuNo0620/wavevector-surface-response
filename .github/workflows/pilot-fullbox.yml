name: pilot-fullbox

on:
  push:
    paths:
      - "config/pilot_fullbox.yaml"
      - "config/pilot_bulk_liquid.yaml"
      - "config/pilot_bulk_vapor.yaml"
      - "src/wvsr/**"
      - "scripts/run_mc.py"
      - "scripts/analyze_modes.py"
      - "scripts/analyze_capillary_coordinates.py"
      - "scripts/analyze_translation_thickness.py"
      - "scripts/analyze_thickness_packing_coupling.py"
      - "scripts/analyze_interfacial_susceptibility.py"
      - "scripts/fit_capillary_massive_model.py"
      - "scripts/plot_mode_summary.py"
      - ".github/workflows/pilot-fullbox.yml"
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run full-box A=0 pilot
        run: |
          python scripts/run_mc.py --config config/pilot_fullbox.yaml --output results/raw/pilot_fullbox.npz
      - name: Run pilot bulk-liquid reference
        run: |
          python scripts/run_mc.py --config config/pilot_bulk_liquid.yaml --output results/raw/pilot_bulk_liquid.npz
      - name: Run pilot bulk-vapor reference
        run: |
          python scripts/run_mc.py --config config/pilot_bulk_vapor.yaml --output results/raw/pilot_bulk_vapor.npz
      - name: Analyze physical interfacial susceptibility
        run: |
          python scripts/analyze_interfacial_susceptibility.py \
            results/raw/pilot_fullbox.npz \
            results/raw/pilot_bulk_liquid.npz \
            results/raw/pilot_bulk_vapor.npz \
            --output-dir results/processed/interfacial_susceptibility
      - name: Analyze all q modes
        run: |
          python scripts/analyze_modes.py results/raw/pilot_fullbox.npz --output-dir results/processed/pilot_modes --n-modes 16
      - name: Analyze capillary coordinates
        run: |
          python scripts/analyze_capillary_coordinates.py results/raw/pilot_fullbox.npz --output-dir results/processed/capillary_coordinates
      - name: Analyze translation and thickness modes
        run: |
          python scripts/analyze_translation_thickness.py results/raw/pilot_fullbox.npz --output-dir results/processed/translation_thickness
      - name: Analyze thickness-packing coupling
        run: |
          python scripts/analyze_thickness_packing_coupling.py results/raw/pilot_fullbox.npz --output-dir results/processed/thickness_packing
      - name: Fit capillary-coordinate models
        run: |
          python scripts/fit_capillary_massive_model.py results/processed/capillary_coordinates/capillary_coordinate_summary.csv --output-dir results/processed/capillary_model_fits
      - name: Make diagnostic figures
        run: |
          python scripts/plot_mode_summary.py results/processed/pilot_modes/mode_summary.csv --output-dir results/figures/pilot
      - name: Check finite outputs
        run: |
          python - <<'PY'
          import csv
          import math
          from pathlib import Path

          p = Path('results/processed/pilot_modes/mode_summary.csv')
          rows = list(csv.DictReader(p.open()))
          assert len(rows) == 12, len(rows)
          keys = [
              'qx','capture_m2','capture_m4','capture_m8','capture_m16',
              'principal1_m4','principal2_m4','principal1_m8','principal2_m8',
              'var_total','closure_error','interface_z_1','interface_z_2','profile_drift_rms'
          ]
          for r in rows:
              for key in keys:
                  assert math.isfinite(float(r[key])), (key, r[key])
              for key in ['capture_m2','capture_m4','capture_m8','capture_m16','principal1_m4','principal2_m4','principal1_m8','principal2_m8']:
                  assert 0.0 <= float(r[key]) <= 1.0, (key, r[key])
              assert float(r['capture_m2']) <= float(r['capture_m4']) + 1e-12
              assert float(r['capture_m4']) <= float(r['capture_m8']) + 1e-12
              assert float(r['capture_m8']) <= float(r['capture_m16']) + 1e-12
              assert float(r['interface_z_1']) < float(r['interface_z_2'])
              assert abs(float(r['closure_error'])) < 1e-8 * max(1.0, abs(float(r['var_total'])))

          c = Path('results/processed/capillary_coordinates/capillary_coordinate_summary.csv')
          crows = list(csv.DictReader(c.open()))
          assert len(crows) == 12, len(crows)
          for r in crows:
              for key in ['qx','var_h_plus','var_h_minus','q2_var_h_plus','q2_var_h_minus','corr_h1_h2_re']:
                  assert math.isfinite(float(r[key])), (key, r[key])
              assert float(r['var_h_plus']) >= 0.0
              assert float(r['var_h_minus']) >= 0.0

          t = Path('results/processed/translation_thickness/translation_thickness_summary.csv')
          trows = list(csv.DictReader(t.open()))
          assert len(trows) == 12, len(trows)
          for r in trows:
              for key in ['qx','var_H','var_W','q2_var_H','q2_var_W','corr_HW_re','thickness_to_translation_ratio']:
                  assert math.isfinite(float(r[key])), (key, r[key])
              assert float(r['var_H']) >= 0.0
              assert float(r['var_W']) >= 0.0
              assert float(r['thickness_to_translation_ratio']) >= 0.0

          u = Path('results/processed/thickness_packing/thickness_packing_summary.csv')
          urows = list(csv.DictReader(u.open()))
          assert len(urows) == 12, len(urows)
          for r in urows:
              for key in ['qx','eta_W_perp','eta_H_perp','max_point_corr_W_perp','max_point_corr_H_perp','R2_W_pc4','R2_H_pc4']:
                  assert math.isfinite(float(r[key])), (key, r[key])
              assert 0.0 <= float(r['eta_W_perp']) <= 1.0 + 1e-12
              assert 0.0 <= float(r['eta_H_perp']) <= 1.0 + 1e-12

          g = Path('results/processed/interfacial_susceptibility/interfacial_susceptibility_summary.csv')
          grows = list(csv.DictReader(g.open()))
          assert len(grows) == 12, len(grows)
          for r in grows:
              for key in ['qx','var_X_slab','var_X_bulk_matched','var_X_excess','chi_gamma_pilot']:
                  assert math.isfinite(float(r[key])), (key, r[key])

          print('all extended pilot outputs validated')
          PY
      - name: Upload pilot results
        uses: actions/upload-artifact@v4
        with:
          name: pilot-fullbox-extended-results
          path: |
            results/raw/pilot_fullbox.npz
            results/raw/pilot_bulk_liquid.npz
            results/raw/pilot_bulk_vapor.npz
            results/processed/interfacial_susceptibility/**
            results/processed/pilot_modes/**
            results/processed/capillary_coordinates/**
            results/processed/translation_thickness/**
            results/processed/thickness_packing/**
            results/processed/capillary_model_fits/**
            results/figures/pilot/**
          retention-days: 30

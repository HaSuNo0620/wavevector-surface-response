name: Finalize constant susceptibility test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ti-constant-finalize.yml'

permissions:
  actions: read
  contents: read

env:
  OLD_RUN_ID: '34430175554'
  RECOVERY_RUN_ID: '34440848926'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download required artifacts with pagination
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import io, json, os, re, subprocess, urllib.request, zipfile
          from pathlib import Path

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          out = Path('results/constant_inputs')
          out.mkdir(parents=True, exist_ok=True)
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          def list_artifacts(run_id):
              arts = []
              page = 1
              while True:
                  url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100&page={page}'
                  data = get_json(url)
                  batch = data.get('artifacts', [])
                  arts.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              print(f'run {run_id}: listed {len(arts)} artifacts across {page} page(s)')
              return arts

          old = list_artifacts(os.environ['OLD_RUN_ID'])
          rec = list_artifacts(os.environ['RECOVERY_RUN_ID'])

          old_pat = re.compile(r'^const-scan-(slab|liquid|vapor)-nx(1|16|18)-[pm]A0\.(02|04|08)-rep[123]$')
          rec_pat = re.compile(r'^recovery-(baseline-(slab|liquid|vapor)-rep[123]|scan-(slab|liquid|vapor)-nx(8|14)-[pm]A0\.(02|04|08)-rep[123])$')
          selected = [a for a in old if old_pat.match(a['name'])] + [a for a in rec if rec_pat.match(a['name'])]
          print(f'selected artifacts: {len(selected)}')

          expected_old = 3 * 3 * 6 * 3
          expected_rec = 3 * 3 + 3 * 2 * 6 * 3
          old_count = sum(1 for a in selected if a in old)
          rec_count = sum(1 for a in selected if a in rec)
          if old_count != expected_old:
              raise RuntimeError(f'old selection count mismatch: expected {expected_old}, got {old_count}')
          if rec_count != expected_rec:
              raise RuntimeError(f'recovery selection count mismatch: expected {expected_rec}, got {rec_count}')

          tmp = Path('results/artifact_tmp.zip')
          for k, a in enumerate(selected, 1):
              subprocess.run([
                  'curl', '-L', '-f', '-sS',
                  '-H', f'Authorization: Bearer {token}',
                  '-H', 'Accept: application/vnd.github+json',
                  a['archive_download_url'],
                  '-o', str(tmp),
              ], check=True)
              with zipfile.ZipFile(tmp) as zf:
                  for member in zf.namelist():
                      if member.endswith('.npz'):
                          target = out / Path(member).name
                          target.write_bytes(zf.read(member))
              if k % 25 == 0 or k == len(selected):
                  print(f'downloaded {k}/{len(selected)}')
          tmp.unlink(missing_ok=True)

          npz = list(out.glob('*.npz'))
          print(f'NPZ count after extraction: {len(npz)}')
          expected_npz = expected_old + expected_rec
          if len(npz) != expected_npz:
              raise RuntimeError(f'NPZ count mismatch: expected {expected_npz}, got {len(npz)}')
          PY
      - name: Analyze constant susceptibility hypothesis
        run: |
          python scripts/analyze_constant_chi_scan.py \
            results/constant_inputs \
            --output-dir results/processed/ti_constant_test
      - name: Upload final analysis
        uses: actions/upload-artifact@v4
        with:
          name: ti-constant-final-analysis
          path: results/processed/ti_constant_test
          if-no-files-found: error

name: ti-constant-test

on:
  push:
    paths:
      - "scripts/analyze_constant_chi_scan.py"
      - "config/ti_slab.yaml"
      - "config/ti_bulk_liquid.yaml"
      - "config/ti_bulk_vapor.yaml"
      - "scripts/run_mc.py"
      - "src/wvsr/**"
      - "pyproject.toml"
      - ".github/workflows/ti-constant-test.yml"
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        phase: [slab, liquid, vapor]
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Select config and seed
        id: cfg
        shell: bash
        run: |
          case "${{ matrix.phase }}" in
            slab)   echo "path=config/ti_slab.yaml" >> "$GITHUB_OUTPUT"; POFF=100000 ;;
            liquid) echo "path=config/ti_bulk_liquid.yaml" >> "$GITHUB_OUTPUT"; POFF=200000 ;;
            vapor)  echo "path=config/ti_bulk_vapor.yaml" >> "$GITHUB_OUTPUT"; POFF=300000 ;;
          esac
          SEED=$((20260910 + POFF + 1000*${{ matrix.replica }}))
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
      - name: Run baseline
        run: |
          python scripts/run_mc.py \
            --config "${{ steps.cfg.outputs.path }}" \
            --output "results/raw/const_baseline_${{ matrix.phase }}_rep${{ matrix.replica }}.npz" \
            --seed "${{ steps.cfg.outputs.seed }}"
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: const-baseline-${{ matrix.phase }}-rep${{ matrix.replica }}
          path: results/raw/const_baseline_${{ matrix.phase }}_rep${{ matrix.replica }}.npz
          retention-days: 30

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        phase: [slab, liquid, vapor]
        nx: [1, 8, 14, 16, 18]
        amplitude: ["0.02", "0.04", "0.08"]
        sign: ["p", "m"]
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Select config, amplitude, and seed
        id: cfg
        shell: bash
        run: |
          case "${{ matrix.phase }}" in
            slab)   echo "path=config/ti_slab.yaml" >> "$GITHUB_OUTPUT"; POFF=100000 ;;
            liquid) echo "path=config/ti_bulk_liquid.yaml" >> "$GITHUB_OUTPUT"; POFF=200000 ;;
            vapor)  echo "path=config/ti_bulk_vapor.yaml" >> "$GITHUB_OUTPUT"; POFF=300000 ;;
          esac
          if [ "${{ matrix.sign }}" = "m" ]; then
            AMP="-${{ matrix.amplitude }}"
            SOFF=500
          else
            AMP="${{ matrix.amplitude }}"
            SOFF=0
          fi
          case "${{ matrix.amplitude }}" in
            "0.02") AOFF=20 ;;
            "0.04") AOFF=40 ;;
            "0.08") AOFF=80 ;;
          esac
          SEED=$((20260910 + POFF + 1000*${{ matrix.replica }} + 10*${{ matrix.nx }} + SOFF + AOFF))
          echo "amplitude=$AMP" >> "$GITHUB_OUTPUT"
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
      - name: Run strong symmetric finite-A point
        shell: bash
        run: |
          TAG=$(echo "${{ matrix.amplitude }}" | sed 's/\./p/g')
          OUT="results/raw/const_${{ matrix.phase }}_nx${{ matrix.nx }}_${{ matrix.sign }}A${TAG}_rep${{ matrix.replica }}.npz"
          python scripts/run_mc.py \
            --config "${{ steps.cfg.outputs.path }}" \
            --output "$OUT" \
            --field-amplitude "${{ steps.cfg.outputs.amplitude }}" \
            --field-nx "${{ matrix.nx }}" \
            --seed "${{ steps.cfg.outputs.seed }}"
      - name: Upload scan point
        uses: actions/upload-artifact@v4
        with:
          name: const-scan-${{ matrix.phase }}-nx${{ matrix.nx }}-${{ matrix.sign }}A${{ matrix.amplitude }}-rep${{ matrix.replica }}
          path: results/raw/const_${{ matrix.phase }}_nx${{ matrix.nx }}_${{ matrix.sign }}A*_rep${{ matrix.replica }}.npz
          retention-days: 30

  analyze:
    needs: [baseline, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download all constant-test inputs
        uses: actions/download-artifact@v4
        with:
          pattern: const-*
          path: results/constant_inputs
          merge-multiple: true
      - name: Analyze constant susceptibility hypothesis
        run: |
          python scripts/analyze_constant_chi_scan.py \
            results/constant_inputs \
            --output-dir results/processed/ti_constant_test
      - name: Validate outputs
        run: |
          python - <<'PY'
          import pandas as pd
          s = pd.read_csv('results/processed/ti_constant_test/constant_chi_summary.csv')
          q = pd.read_csv('results/processed/ti_constant_test/q_extrapolated_chi.csv')
          assert len(q) == 5, len(q)
          assert q[['qx','chi_extrap','se_chi_extrap','chi_fdt']].notna().all().all()
          assert s[['constant_chi0','se_constant_chi0','chi2_constant_q']].notna().all().all()
          print(s.to_string(index=False))
          print(q.to_string(index=False))
          PY
      - name: Upload constant-test results
        uses: actions/upload-artifact@v4
        with:
          name: ti-constant-test-results
          path: results/processed/ti_constant_test/**
          retention-days: 30

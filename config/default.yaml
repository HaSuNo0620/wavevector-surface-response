simulation:
  seed: 20260909
  temperature: 1.0
  beta: 1.0
  box: [16.0, 16.0, 48.0]
  n_particles: 4800
  cutoff: 2.5
  neighbor_skin: 0.5
  max_displacement: 0.12
  equilibration_sweeps: 2000
  production_sweeps: 10000
  sample_every: 10
  z_bins: 192
  two_interfaces: true

initialization:
  mode: slab
  liquid_density: 0.7876
  liquid_fraction_z: 0.52
  min_separation: 0.85

wavevectors:
  # Stage 1: q_perp=0. Integer n_x guarantees exact PBC commensurability.
  # Include both long-wavelength interface response and the molecular packing range.
  n_x: [1, 2, 3, 4, 6, 8, 10, 12, 14, 16, 18, 20]

analysis:
  derivative_smoothing_bins: 3
  n_eigenmodes: 12
  bulk_exclusion_fraction: 0.22
  bootstrap_blocks: 20

notes:
  stage: "q_perp=0 wavevector-resolved interfacial-response sector crossover"
  purpose: "Measure the external-field susceptibility first, then resolve interface-like, cross, thickness/breathing, and microscopic packing contributions. Capillary q^-2 scaling is only a long-wavelength auxiliary diagnostic."
  warning: "These numerical defaults are an internally consistent starting point, not final production parameters. Match N, box, coexistence densities, cutoff and run length to the validated one-component model before publication-quality runs."

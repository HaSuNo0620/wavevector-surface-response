simulation:
  seed: 7
  temperature: 1.0
  beta: 1.0
  box: [8.0, 8.0, 16.0]
  n_particles: 256
  cutoff: 2.5
  neighbor_skin: 0.5
  max_displacement: 0.12
  equilibration_sweeps: 5

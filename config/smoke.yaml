  liquid_density: 0.72
  liquid_fraction_z: 0.62
  min_separation: 0.85

wavevectors:
  n_x: [1, 2, 3]

analysis:
  n_eigenmodes: 6

notes:
  stage: "CI smoke test only; not physical production data"
